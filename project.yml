name: WesomeCloud
options:
  bundleIdPrefix: cloud.wesome
  deploymentTarget:
    macOS: "15.0"
packages:
  WesomeCloud:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  WesomeCloud:
    type: application
    platform: macOS
    sources:
      - path: AppHost/WesomeCloudApp
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: docs/Sparkle-LICENSE.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.wesome.wesomecloud
        PRODUCT_NAME: WesomeCloud
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: AppHost/Info.plist
        WESOME_CLOUD_APPCAST_URL: https://patriksimms.github.io/wesomecloud/appcast.xml
        WESOME_CLOUD_SPARKLE_PUBLIC_ED_KEY: fOPlElKk/tNy/Qwe0N5P0EOMPobANYQYGYfRCqb4zME=
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: AppHost/WesomeCloud-Debug.entitlements
          ENABLE_DEBUG_DYLIB: NO
        Release:
          ARCHS: arm64
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: AppHost/WesomeCloud.entitlements
    dependencies:
      - package: WesomeCloud
        product: WesomeCloudMacApp
      - package: Sparkle
        product: Sparkle
      - target: WesomeFileProviderExtensionHost
        embed: true
  WesomeFileProviderExtensionHost:
    type: app-extension
    platform: macOS
    sources:
      - path: AppHost/WesomeFileProviderExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.wesome.wesomecloud.fileprovider
        PRODUCT_NAME: WesomeFileProviderExtension
        PRODUCT_MODULE_NAME: WesomeFileProviderExtensionHost
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: AppHost/WesomeFileProviderExtension-Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: AppHost/WesomeFileProviderExtension-Debug.entitlements
        Release:
          ARCHS: arm64
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: AppHost/WesomeFileProviderExtension.entitlements
    dependencies:
      - package: WesomeCloud
        product: WesomeFileProviderExtension
